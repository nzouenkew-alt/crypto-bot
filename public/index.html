<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Crypto Bot — Binance</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#00e676;--red:#ff5252;--yellow:#ffd740;--blue:#64b5f6;
  --bg:#080b10;--card:rgba(255,255,255,0.03);--border:rgba(255,255,255,0.07);
}
body{background:var(--bg);color:#ddd;font-family:'JetBrains Mono',monospace;min-height:100vh;padding:16px}
h1{font-family:'Orbitron',monospace;font-size:20px;color:var(--green);letter-spacing:3px;text-align:center;margin-bottom:4px}
.sub{text-align:center;font-size:10px;color:#445;letter-spacing:2px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:12px}
label{font-size:10px;color:#556;letter-spacing:1px;display:block;margin-bottom:6px}
input,select{background:rgba(255,255,255,0.05);border:1px solid var(--border);color:#fff;padding:11px 14px;border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:13px;width:100%;outline:none;transition:border .2s}
input:focus,select:focus{border-color:var(--green)}
select option{background:#0d1117}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.mb{margin-bottom:12px}
.btn{border:none;padding:13px;border-radius:9px;font-family:'Orbitron',monospace;font-weight:700;font-size:12px;cursor:pointer;letter-spacing:1px;transition:all .2s;width:100%}
.btn-g{background:linear-gradient(135deg,#00e676,#00c853);color:#000}
.btn-g:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,230,118,.4)}
.btn-r{background:linear-gradient(135deg,#ff5252,#c62828);color:#fff}
.btn-r:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(255,82,82,.4)}
.btn-o{background:rgba(255,255,255,0.07);color:#aaa;border:1px solid var(--border)}
.btn-o:hover{background:rgba(255,255,255,0.12)}
.ind-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.ind{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center}
.ind .lbl{font-size:9px;color:#445;margin-bottom:4px;letter-spacing:1px}
.ind .val{font-size:16px;font-weight:700}
.price-big{font-family:'Orbitron',monospace;font-size:28px;font-weight:900;margin:4px 0}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.blink{animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.pulse{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.log-box{background:#000;border:1px solid var(--border);border-radius:10px;padding:12px;height:160px;overflow-y:auto;font-size:11px;line-height:1.7}
.log-box::-webkit-scrollbar{width:4px}
.log-box::-webkit-scrollbar-thumb{background:#222;border-radius:2px}
.log-g{color:var(--green)}.log-r{color:var(--red)}.log-y{color:var(--yellow)}.log-d{color:#445}
.signal-box{border-radius:14px;padding:18px;margin-bottom:12px;animation:slideIn .3s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10px;letter-spacing:1px;font-weight:600}
.hidden{display:none}
.bal-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px}
.bal-row:last-child{border:none}
.trend-up{color:var(--green)}.trend-dn{color:var(--red)}
canvas{width:100%;height:80px;display:block;border-radius:8px;margin-top:8px}
</style>
</head>
<body>

<h1>◈ CRYPTO BOT</h1>
<div class="sub">BINANCE — TRADING ASSISTANT</div>

<!-- SETUP -->
<div id="setup">
  <div class="card">
    <div style="font-size:11px;color:var(--green);margin-bottom:14px;letter-spacing:1px">⚙ CONFIGURATION</div>
    <div class="row">
      <div>
        <label>PAIRE</label>
        <select id="pair">
          <option>BTCUSDT</option><option>ETHUSDT</option><option>BNBUSDT</option>
          <option>SOLUSDT</option><option>XRPUSDT</option><option>ADAUSDT</option>
        </select>
      </div>
      <div>
        <label>INTERVALLE</label>
        <select id="interval">
          <option value="15m">15 min</option>
          <option value="1h" selected>1 heure</option>
          <option value="4h">4 heures</option>
          <option value="1d">1 jour</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div>
        <label>BUDGET USDT ($)</label>
        <input type="number" id="budget" placeholder="Ex: 50" min="10"/>
      </div>
      <div>
        <label>% PAR TRADE</label>
        <select id="pct">
          <option value="0.2">20% — Faible risque</option>
          <option value="0.35">35% — Moyen</option>
          <option value="0.5">50% — Élevé</option>
        </select>
      </div>
    </div>
    <div class="mb">
      <label>STOP LOSS %</label>
      <select id="sl">
        <option value="0.02">2% — Très prudent ⭐</option>
        <option value="0.03">3% — Prudent</option>
        <option value="0.05">5% — Normal</option>
      </select>
    </div>
    <button class="btn btn-g" onclick="startBot()">▶ DÉMARRER LE BOT</button>
  </div>
  <div style="font-size:10px;color:#334;text-align:center;line-height:1.8">
    ⚠ Assurez-vous que vos clés API sont dans le fichier .env<br>
    Ne jamais activer la permission "Retrait" sur votre clé API
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">

  <!-- Status -->
  <div class="card" style="display:flex;justify-content:space-between;align-items:center">
    <div>
      <span class="status-dot blink" style="background:var(--green)"></span>
      <span id="pair-label" style="font-size:13px;color:var(--green);font-weight:600"></span>
    </div>
    <div id="last-update" style="font-size:10px;color:#445"></div>
    <button class="btn btn-o" style="width:auto;padding:8px 14px;font-size:10px" onclick="stopBot()">⏹ STOP</button>
  </div>

  <!-- Prix -->
  <div class="card">
    <label>PRIX ACTUEL</label>
    <div id="price-display" class="price-big" style="color:var(--green)">—</div>
    <canvas id="chart"></canvas>
  </div>

  <!-- Indicateurs -->
  <div class="ind-grid">
    <div class="ind">
      <div class="lbl">RSI (14)</div>
      <div class="val" id="rsi-val">—</div>
    </div>
    <div class="ind">
      <div class="lbl">MA 7</div>
      <div class="val" style="color:var(--blue)" id="ma7-val">—</div>
    </div>
    <div class="ind">
      <div class="lbl">MA 25</div>
      <div class="val" style="color:#ba68c8" id="ma25-val">—</div>
    </div>
  </div>

  <!-- Tendance -->
  <div class="card" style="display:flex;justify-content:space-between;align-items:center;padding:14px 18px">
    <div>
      <div style="font-size:10px;color:#445;margin-bottom:2px">TENDANCE</div>
      <div id="trend-val" style="font-size:14px;font-weight:700">—</div>
    </div>
    <div style="text-align:right">
      <div style="font-size:10px;color:#445;margin-bottom:2px">P&L ESTIMÉ</div>
      <div id="pnl-val" style="font-size:16px;font-weight:700">$0.00</div>
    </div>
  </div>

  <!-- Solde -->
  <div class="card">
    <div style="font-size:10px;color:var(--green);margin-bottom:10px;letter-spacing:1px">💰 SOLDE BINANCE</div>
    <div id="balance-list"><div style="color:#445;font-size:12px">Chargement...</div></div>
    <button class="btn btn-o" style="margin-top:10px;font-size:11px" onclick="loadBalance()">↻ Actualiser</button>
  </div>

  <!-- Signal de confirmation -->
  <div id="signal-box" class="hidden"></div>

  <!-- Journal -->
  <div class="card">
    <div style="font-size:10px;color:#445;margin-bottom:8px;letter-spacing:1px">◈ JOURNAL</div>
    <div class="log-box" id="log"></div>
  </div>

</div>

<script>
const SERVER = window.location.origin;
let botInterval = null;
let chartPrices = [];
let entryPrice = null;
let currentQty = 0;

// ─── Démarrer ───────────────────────────────────────────
function startBot() {
  const budget = parseFloat(document.getElementById('budget').value);
  if (!budget || budget < 5) return alert('Entrez un budget valide (minimum $5)');
  document.getElementById('setup').classList.add('hidden');
  document.getElementById('dashboard').classList.remove('hidden');
  document.getElementById('pair-label').textContent = document.getElementById('pair').value;
  addLog('🚀 Bot démarré — ' + document.getElementById('pair').value, 'g');
  loadBalance();
  analyze();
  botInterval = setInterval(analyze, 30000); // toutes les 30 secondes
}

// ─── Arrêter ────────────────────────────────────────────
function stopBot() {
  clearInterval(botInterval);
  document.getElementById('setup').classList.remove('hidden');
  document.getElementById('dashboard').classList.add('hidden');
  addLog('⏹ Bot arrêté', 'y');
}

// ─── Analyse ────────────────────────────────────────────
async function analyze() {
  const symbol   = document.getElementById('pair').value;
  const interval = document.getElementById('interval').value;
  try {
    // Prix actuel
    const priceRes = await fetch(`${SERVER}/api/price/${symbol}`);
    const priceData = await priceRes.json();
    const price = priceData.price;

    // Mettre à jour affichage prix
    const prev = chartPrices[chartPrices.length - 1] || price;
    document.getElementById('price-display').textContent = '$' + (parseFloat(price) || 0).toFixed(2);
    document.getElementById('price-display').style.color = price >= prev ? 'var(--green)' : 'var(--red)';
    chartPrices.push(price);
    if (chartPrices.length > 50) chartPrices.shift();
    drawChart(price >= prev);

    // P&L
    if (entryPrice && currentQty > 0) {
      const pnl = (price - entryPrice) * currentQty;
      const el = document.getElementById('pnl-val');
      el.textContent = (pnl >= 0 ? '+' : '') + '$' + pnl.toFixed(2);
      el.style.color = pnl >= 0 ? 'var(--green)' : 'var(--red)';

      // Stop Loss automatique
      const sl = parseFloat(document.getElementById('sl').value);
      if (price <= entryPrice * (1 - sl)) {
        addLog(`🛑 STOP LOSS déclenché à $${price.toFixed(2)}`, 'r');
        showSignal({ action:'VENDRE', confidence:99, reason:`Stop loss de ${sl*100}% atteint. Protection automatique.`, price });
        return;
      }
    }

    // Analyse technique
    const res = await fetch(`${SERVER}/api/analyze/${symbol}?interval=${interval}`);
    const data = await res.json();

    document.getElementById('rsi-val').textContent = data.rsi;
    document.getElementById('rsi-val').style.color = data.rsi < 30 ? 'var(--green)' : data.rsi > 70 ? 'var(--red)' : 'var(--yellow)';
    document.getElementById('ma7-val').textContent = data.ma7 > 1000 ? Math.round(data.ma7).toLocaleString() : data.ma7;
    document.getElementById('ma25-val').textContent = data.ma25 > 1000 ? Math.round(data.ma25).toLocaleString() : data.ma25;

    const trendEl = document.getElementById('trend-val');
    trendEl.textContent = data.trend;
    trendEl.className = data.trend === 'HAUSSIÈRE' ? 'trend-up' : 'trend-dn';

    document.getElementById('last-update').textContent = '↻ ' + new Date().toLocaleTimeString('fr-FR');

    if (data.signal) {
      addLog(`⚡ Signal: ${data.signal.action} — Confiance ${data.signal.confidence}%`, data.signal.action === 'ACHETER' ? 'g' : 'r');
      showSignal({ ...data.signal, price });
      clearInterval(botInterval);
    }

  } catch(e) {
    addLog('⚠ Erreur: ' + e.message, 'y');
  }
}

// ─── Afficher Signal ────────────────────────────────────
function showSignal(sig) {
  const is买 = sig.action === 'ACHETER';
  const budget = parseFloat(document.getElementById('budget').value) || 0;
  const pct    = parseFloat(document.getElementById('pct').value);
  const invest = (budget * pct).toFixed(2);
  const qty    = (invest / sig.price).toFixed(6);

  const box = document.getElementById('signal-box');
  box.className = 'signal-box';
  box.style.background = is买 ? 'rgba(0,230,118,0.08)' : 'rgba(255,82,82,0.08)';
  box.style.border = `1px solid ${is买 ? 'rgba(0,230,118,0.4)' : 'rgba(255,82,82,0.4)'}`;
  box.innerHTML = `
    <div style="font-family:'Orbitron',monospace;font-size:18px;font-weight:900;color:${is买?'var(--green)':'var(--red)'};margin-bottom:8px">
      ${is买?'🟢':'🔴'} SIGNAL: ${sig.action}
    </div>
    <div style="font-size:12px;color:#bbb;margin-bottom:8px;line-height:1.7">${sig.reason}</div>
    <div style="font-size:11px;color:#667;margin-bottom:6px">
      Prix: <span style="color:#fff">$${parseFloat(sig.price).toFixed(2)}</span>
    </div>
    <div style="font-size:11px;color:#667;margin-bottom:6px">
      Montant: <span style="color:#fff">$${invest}</span> → <span style="color:#fff">${qty} ${document.getElementById('pair').value.replace('USDT','')}</span>
    </div>
    <div style="font-size:11px;color:#667;margin-bottom:14px">
      Confiance: <span style="color:${is买?'var(--green)':'var(--red)'}">${sig.confidence}%</span>
    </div>
    <div style="font-size:13px;font-weight:700;color:${is买?'var(--green)':'var(--red)'};margin-bottom:12px">
      ⚠ Voulez-vous ${is买?'ACHETER':'VENDRE'} ?
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <button class="btn btn-g" onclick="confirmOrder('${sig.action}','${qty}','${sig.price}')">✓ OUI, CONFIRMER</button>
      <button class="btn btn-r" onclick="rejectSignal()">✗ NON, IGNORER</button>
    </div>
  `;
  box.classList.remove('hidden');
}

// ─── Confirmer Ordre ────────────────────────────────────
async function confirmOrder(side, qty, price) {
  const symbol = document.getElementById('pair').value;
  try {
    addLog(`📤 Envoi ordre ${side} ${qty} ${symbol}...`, 'y');
    const res = await fetch(`${SERVER}/api/order`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ symbol, side: side === 'ACHETER' ? 'BUY' : 'SELL', quantity: qty }),
    });
    const data = await res.json();
    if (data.success) {
      if (side === 'ACHETER') { entryPrice = parseFloat(price); currentQty = parseFloat(qty); }
      else { entryPrice = null; currentQty = 0; document.getElementById('pnl-val').textContent = '$0.00'; }
      addLog(`✅ Ordre exécuté avec succès — ID: ${data.order.orderId}`, 'g');
      loadBalance();
    } else {
      addLog(`❌ Erreur ordre: ${data.error}`, 'r');
    }
  } catch(e) {
    addLog('❌ Erreur: ' + e.message, 'r');
  }
  document.getElementById('signal-box').classList.add('hidden');
  botInterval = setInterval(analyze, 30000);
}

// ─── Rejeter Signal ─────────────────────────────────────
function rejectSignal() {
  addLog('❌ Signal ignoré par l\'utilisateur', 'y');
  document.getElementById('signal-box').classList.add('hidden');
  botInterval = setInterval(analyze, 30000);
}

// ─── Solde ──────────────────────────────────────────────
async function loadBalance() {
  try {
    const res = await fetch(`${SERVER}/api/balance`);
    const data = await res.json();
    const el = document.getElementById('balance-list');
    if (!data.balances || data.balances.length === 0) {
      el.innerHTML = '<div style="color:#445;font-size:12px">Aucun solde disponible</div>';
      return;
    }
    el.innerHTML = data.balances.slice(0,8).map(b =>
      `<div class="bal-row">
        <span style="color:#aaa">${b.asset}</span>
        <span style="color:#fff">${b.free.toFixed(4)} <span style="color:#445">(+${b.locked.toFixed(4)} bloqué)</span></span>
      </div>`
    ).join('');
  } catch(e) {
    document.getElementById('balance-list').innerHTML = '<div style="color:var(--red);font-size:12px">Erreur de connexion API</div>';
  }
}

// ─── Graphique ──────────────────────────────────────────
function drawChart(up) {
  const canvas = document.getElementById('chart');
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth * window.devicePixelRatio;
  canvas.height = 80 * window.devicePixelRatio;
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
  const w = canvas.offsetWidth, h = 80;
  const prices = chartPrices;
  if (prices.length < 2) return;
  const min = Math.min(...prices), max = Math.max(...prices);
  const color = up ? '#00e676' : '#ff5252';
  ctx.clearRect(0,0,w,h);
  const pts = prices.map((p,i) => ({ x: (i/(prices.length-1))*w, y: h - ((p-min)/(max-min||1))*h }));
  ctx.beginPath();
  ctx.moveTo(pts[0].x, h);
  pts.forEach(p => ctx.lineTo(p.x, p.y));
  ctx.lineTo(pts[pts.length-1].x, h);
  ctx.closePath();
  const grad = ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0, color + '55');
  grad.addColorStop(1, color + '00');
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.beginPath();
  pts.forEach((p,i) => i===0 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y));
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.stroke();
}

// ─── Journal ────────────────────────────────────────────
function addLog(msg, type='d') {
  const el = document.getElementById('log');
  const time = new Date().toLocaleTimeString('fr-FR');
  const cls = 'log-' + type;
  el.innerHTML += `<div class="${cls}"><span class="log-d">[${time}]</span> ${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}
</script>
</body>
</html>
